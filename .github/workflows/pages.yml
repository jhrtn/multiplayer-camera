# Builds the encrypted page and publishes it to GitHub Pages.
# Needs a repository secret PAGE_PASSWORD, and Pages set to "GitHub Actions".
# Optional TURN relay secrets: TURN_URLS, TURN_USERNAME, TURN_CREDENTIAL.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          TURN_URLS: ${{ secrets.TURN_URLS }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
